version: 2.1
jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
      - run:
          name: Run Unit Tests
          command: |
            . venv/bin/activate
            export PYTHONPATH="$PYTHONPATH:$(pwd):$(pwd)/src"
            pytest -v

workflows:
  version: 2
  test_all:
    jobs:
      - test
